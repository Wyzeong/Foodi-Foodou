<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Foodi-Foodou — Recettes & Menu</title>
<meta name="description" content="Carnet de recettes et menu de la semaine, 100% hors ligne." />

<!-- PWA : manifest + couleur de thème -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#8C3A34" />

<!-- Installation iOS ("Ajouter à l'écran d'accueil") -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Foodi-Foodou" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

<link rel="icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header" id="app-header">
      <button class="icon-btn back-btn hidden" id="header-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="header-title">Foodi-Foodou</h1>
    </header>
    <main id="app-main"></main>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bottom-nav-btn" data-go="week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <span>Semaine</span>
      </button>
      <button class="bottom-nav-btn" data-go="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/></svg>
        <span>Recettes</span>
      </button>
      <button class="bottom-nav-btn" data-go="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        <span>Paramètres</span>
      </button>
    </nav>
  </div>

  <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
