<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MonCarnet — Recettes & Menu</title>
<meta name="description" content="Carnet de recettes et menu de la semaine, 100% hors ligne." />

<!-- PWA : manifest + couleur de thème -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#8C3A34" />

<!-- Installation iOS ("Ajouter à l'écran d'accueil") -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MonCarnet" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

<link rel="icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header" id="app-header">
      <button class="icon-btn back-btn hidden" id="header-back" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="header-title">MonCarnet</h1>
    </header>
    <main id="app-main"></main>
  </div>

  <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
